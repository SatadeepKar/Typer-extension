<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto Typer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Auto Typer</h1>

  <label for="text">Paragraph to type</label>
  <textarea id="text" rows="7" placeholder="Paste or write the text you want typed…"></textarea>
  <div class="meta"><span id="wordCount">0 words</span><span id="eta"></span></div>

  <label for="wpm">Speed: <strong><span id="wpmValue">60</span> WPM</strong></label>
  <div class="row">
    <input id="wpmRange" type="range" min="5" max="300" step="1" value="60">
    <input id="wpm" type="number" min="1" max="2000" value="60">
  </div>

  <label for="delay">Start delay (seconds)</label>
  <input id="delay" type="number" min="1" max="30" value="3">

  <label class="check"><input id="humanize" type="checkbox" checked> Human-like rhythm (small random variation)</label>

  <div class="buttons">
    <button id="start" class="primary">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <p id="status" class="status">Click Start, then click into the text field you want to type in before the countdown ends.</p>

  <script src="popup.js"></script>
</body>
</html>
